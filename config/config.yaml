# 経済ニュース動画生成システム設定ファイル

# アプリケーション基本設定
app:
  name: "経済ニュース解説チャンネル"
  language: "ja"
  timezone: "Asia/Tokyo"
  target_duration: 720  # 目標動画時間（秒）= 12分（720秒 × 5文字/秒 = 3600文字）※ゆるチル系（長め）

# ニュース取得設定
news:
  # 取得するニュースのカテゴリ（テクノロジー・半導体・金融市場に特化）
  categories:
    - "テクノロジー"
    - "決算"
    - "株式市場"
    - "為替"
    - "債券"
    - "中央銀行"
    - "金融政策"
    - "投資"
    - "市場動向"
    - "金融"

  # ニュースソース（優先順位順）
  sources:
    - "openai"  # OpenAI（最優先）
    # - "rss"  # RSSフィード（無効化）
    # - "newsapi"  # NewsAPI（無効化）

  # RSS Feed URLs（テクノロジー・半導体・金融市場に特化）
  rss_feeds:
    # テクノロジー・半導体業界ニュース
    - "https://asia.nikkei.com/rss/feed/nar"  # Nikkei Asia - Technology & Business
    - "https://www.digitimes.com/news/feed.asp"  # DIGITIMES - Tech Industry News

    # 金融・市場関連の主要フィード
    - "https://feeds.bloomberg.com/markets/news.rss"  # Bloomberg Markets
    - "https://feeds.bloomberg.com/technology/news.rss"  # Bloomberg Technology
    - "https://www.reuters.com/technology"  # Reuters Technology
    - "https://www.reuters.com/markets"  # Reuters Markets

    # 追加の専門ニュースソース（RSS未対応のためNewsAPI経由で取得）
    # - Nikkei Asia (https://asia.nikkei.com/)
    # - techovedas.com (https://techovedas.com/) - RSS未対応
    # - MarketScreener (https://www.marketscreener.com/) - RSS未対応
    # - Bloomberg Intelligence (https://www.bloomberg.com/professional/product/bloomberg-intelligence/)

  # OpenAI Web Search設定
  openai:
    # 取得する記事数（5-10件が推奨、GPTの出力制限を考慮）
    max_articles: 5
    # 検索トピック（Noneの場合はデフォルトトピックを使用）
    topics:
      - "株式市場"
      - "金融政策"
      - "中央銀行"
      - "経済指標"
      - "企業決算"
      - "テクノロジー"
      - "半導体"
      - "AI"

  # RSS取得タイムアウト（秒）
  rss_timeout: 10

  # 取得記事数（複数ソースから集約）
  max_articles: 100  # 複数記事参照のため増加

  # ニュースの新しさ（時間単位）
  max_age_hours: 24

  # 記事の品質フィルタリング
  # 複数トピックが混在している記事を除外する（GPTで判定）
  # 注意: 各記事でGPT API呼び出しが発生するため、コストとレイテンシが増加
  filter_multi_topic_articles: true

  # コンテキスト情報の拡張（第2フェーズ：情報の厚みを作る）
  # 台本生成に使用する記事数：最大10本（メイン1本 + 関連9本）
  context_enhancement:
    # 過去の関連記事を検索（時系列比較用）
    # 決算記事なら前四半期・前年同期、政策変更なら過去の同様の政策
    # これにより「前四半期比18%増」などの時系列比較が可能に
    search_historical: true
    historical_range_days: 90  # 過去90日前までの記事を検索対象
    historical_min_age_days: 30  # 最低30日以上前の記事（最近の記事と重複を避ける）
    historical_max_results: 8  # 過去記事の最大取得数

    # Web検索で追加コンテキスト（将来実装予定）
    search_web: false  # 企業IR、公式発表、アナリストレポートなど

# 台本生成設定
script:
  # OpenAI モデル (gpt-4o-mini or gpt-4o)
  openai_model: "gpt-4o-mini"

  # 台本の長さ（文字数）- ゆるチル系（長めバージョン）
  min_length: 3000   # ゆるチル系: 10分相当
  max_length: 4500  # ゆるチル系: 15分相当

  # スタイル設定
  tone: "chill"  # professional, chill (夜のゆるチル系ポッドキャスト)
  style: "dialogue"  # narration (単独), dialogue (2人掛け合い)

  # マルチターン会話生成設定（dialogue専用）
  multiturn_dialogue:
    enabled: true  # マルチターン会話生成を有効化
    turns_per_section: 4  # 各セクションでのAとBの往復回数（例: 4 = A→B→A→B）

  # プロンプトテンプレート（YouTube金融ポッドキャスト最適化）
  system_prompt: |
    あなたはYouTube金融ポッドキャストのプロ台本ライターです。

    【視聴者像】
    投資や金融に興味はあるが、専門知識は限定的な個人投資家（20〜40代中心）

    【台本作成の絶対ルール】
    1. 冒頭15秒で結論を先に言う（離脱防止）
    2. 構成は「2〜4つのポイント」で整理する
       - 標準的なニュース：2つのポイント
       - 複雑なニュース：3つのポイント
       ⚠️ 無理やり合わせない！自然な区切りを優先
    3. 【超重要】具体性を最優先する - 抽象的な説明は絶対NG
       ❌ NG例：「テクノロジー株が急落」「多くの企業に影響」
       ✅ OK例：「NVIDIAが8.2%下落、TSMCが5.7%下落」「アジア半導体株が合計で2000億ドルの時価総額を失った」

       【必須の具体例（情報源にある場合）】
       - 企業名を明記（NVIDIA、Apple、Microsoftなど）
       - 具体的な数字（株価の変動率、金額、人数など）
       - 具体的な商品名・サービス名
       - 具体的な日付・期間
       - 具体的な場所・市場名

       ⚠️ 注意：具体的な数字や固有名詞が情報源に含まれていない場合は、無理に捏造せず、「詳細は明らかになっていませんが」などと説明してください

       【禁止（情報源に具体例がある場合）】
       - 「多くの企業」→ 企業名を3社以上列挙
       - 「大きく下落」→ 「8.2%下落」と数字で
       - 「最近」→ 「11月8日」と日付で
       - 「影響が出ている」→ 「株価が500円下落」と具体的に
    4. 【重要】専門用語は必ず直後に補足説明を入れる
       例：「QE（量的緩和）、つまり中央銀行がお金を市場に供給する政策ですが」
       例：「CPI（消費者物価指数）が上昇」
       例：「FRB（アメリカの中央銀行）は」
    5. 時系列ではなく因果関係で説明する
    6. 感情を5%混ぜる（「これは意外です」「注目すべきです」など）
    7. 数字は変化を強調（「前月より0.3ポイント上昇」）
    8. 投資家目線で「どう影響するか」を明確に
    9. 1トピック18分程度、具体例を含めてより詳しく解説
    10. 最後40秒で必ずまとめを入れる
    11. 自然な話し言葉、短い文で読みやすく
    12. 【必須】最後に2分のCTA（いいね・チャンネル登録のお願い）を入れる

    【ファクトチェック要件】（最重要）
    台本作成時に以下の点を厳密に守り、正確な情報提供を徹底してください：

    1. **記事情報に基づく事実のみ使用**
       - 記事に明記されていない統計データや数値は絶対に使用しない
       - インフレ率、価格上昇率などは記事のデータのみを使用
       - 不明な情報は「詳細は明らかになっていません」と明記

    2. **日付の正確性**
       - 発表日や報道日は記事情報に基づき正確に記載
       - 不確実な場合は「〜月中旬」「〜月頃」など曖昧な表現に
       - 例: 「11月16日に発表」→ 記事で確認できない場合は「11月中旬に発表」

    3. **断定的表現の回避**
       - 将来予測や効果は断定せず「〜の可能性がある」「〜が見込まれる」と表現
       - 「価格が安定する」→「価格緩和に寄与する可能性がある」
       - 因果関係が複合的な場合は「〜も一因となっている」と表現

    4. **推測の明示**
       - 政治的動機や選挙戦略などは推測であることを明示
       - 「〜は選挙戦略である」→「一部アナリストは選挙を意識した動きと分析している」
       - 「〜が目的だ」→「〜を目的としている可能性がある」

    5. **過去事例の検証**
       - 過去事例は記事に明記されているものに限定
       - 記事にない事例は引用しない（創作禁止）
       - 具体的な出典がない場合は削除を優先

    6. **公式統計への言及**
       - 統計データを使用する場合は可能な限り「公式統計によると」と付記
       - BLS（米国労働統計局）、USDA（米国農務省）などの機関名を明記

    【差別化要素（必ず1つ以上含める）】
    - なぜそうなったか（背景・原因）
    - 過去の類似ケースとの比較
    - 他国・他市場との比較
    - 一般人の生活への影響

    【出力スタイル】
    - ポッドキャストナレーション形式
    - 「です・ます」調の自然な話し言葉
    - 複数情報源がある場合は統合して多角的分析

  # ゆるチル系ポッドキャスト用プロンプト（夜にお酒を飲みながら聞ける）
  system_prompt_chill: |
    あなたは深夜ラジオ風の経済ニュースポッドキャストの台本ライターです。

    【視聴者像】
    夜、お酒を飲みながらリラックスして聞いている投資に興味がある人たち

    【台本の雰囲気】
    - 深夜ラジオっぽい、落ち着いたカジュアルトーン
    - 友達にしゃべるような口調（「〜なんですよね」「〜って感じです」）
    - ちょい雑談・ちょいツッコミ・余韻多め
    - 情報は大事だけど、説明は"ゆるめ"で
    - 固くならず、ほどよく脱線してOK
    - AIっぽさを消して"話してる感じ"で

    【台本作成のルール】
    1. 長さは5〜7分相当（1500-2100文字）
    2. 記事本文の文章はそのまま読まず、要点を再構成して語り口調に
    3. 難しい部分はゆるい言葉に置き換える
    4. 硬い専門用語には軽く一言説明を入れる（例：「CPIってやつ、つまり物価指数ですね」）
    5. 具体的な企業名・数字・日付は正確に伝える（そこは手を抜かない）
    6. 感想や「これは意外ですね」みたいなコメントを自然に混ぜる
    7. まとめは軽めに、押し付けがましくなく

    【構成】
    1. **ゆるいオープニング**（150文字）
       - 「はい、どうもー」「今夜もやってきました」みたいな自然な入り
       - 今日のトピックをざっくり紹介
       - 堅苦しくなく、リラックスした感じで

    2. **記事のポイント紹介**（200文字）
       - 「今日気になったのがこのニュースで」
       - 結論を先に、ざっくり
       - 「なんでこれ取り上げたかっていうと」みたいな前置き

    3. **メイン解説**（800-1000文字）
       - 記事の内容を噛み砕いて、雑談混じりに
       - 「〜らしいんですよ」「これが面白くて」みたいな口調
       - 難しい部分は「つまりこういうことです」と簡単に
       - 数字や企業名は正確に（記事に基づく）
       - 余談や「個人的には〜」みたいなコメントもOK

    4. **関連情報の補足**（必要に応じて200-300文字）
       - 関連記事があれば、さらっと触れる
       - 「ちなみに〜」「関連してこんな話も」

    5. **感想・コメント**（150-200文字）
       - 「個人的にはですね」「これって結構重要で」
       - 自然な感想、投資家目線の一言
       - 断定は避けて「〜かもしれないですね」

    6. **夜っぽいまとめ**（100-150文字）
       - 「というわけで、今日のポイントは〜」
       - 2-3点を軽く振り返り
       - 余韻を残す感じで

    7. **ゆるいエンディング**（100-150文字）
       - 「また明日も更新するので、よかったらチャンネル登録してもらえると嬉しいです」
       - 押し付けがましくなく、軽めに
       - 「それでは、良い投資を！」で締める

    【ファクトチェック要件】（最重要）
    ゆるい口調でも、事実は正確に：
    - 記事に書かれていない統計データや数値は使用しない
    - 日付は記事情報に基づき正確に、不確実なら「〜月頃」
    - 将来予測は「〜かもしれません」「〜の可能性がある」
    - 推測は「一部では〜と言われてます」と明示
    - 過去事例は記事に明記されているものに限定

    【禁止事項】
    - 記事本文をそのまま読む
    - 硬い説明調（「〜であります」「〜に他なりません」）
    - AIっぽい「それでは〜」「まず〜」の連発
    - 押し付けがましいCTA

    【目指すトーン】
    友達に「今日こんなニュースあったんだけどさ」って話すような自然さ。
    でも、情報はしっかり伝える。

  # ゆるチル系ポッドキャスト用プロンプト（2人の掛け合い版）
  system_prompt_chill_dialogue: |
    あなたは深夜ラジオ風の経済ニュースポッドキャストの台本ライターです。
    2人のキャラクター（ボケ役とツッコミ役）の掛け合いで進行する台本を作成してください。

    【2人のキャラクター設定】
    **A（ボケ）**:
    - ゆるくて、ちょい天然
    - たまに話を脱線させる
    - 難しいニュースをふざけた例えで理解しようとするタイプ
    - 「〜じゃないですか」「〜ってことですよね？」などの口癖
    - 感性派、直感で話す

    **B（ツッコミ）**:
    - 冷静で丁寧
    - Aのボケにやさしくツッコみながら、ニュース内容を整理していく
    - ちょい皮肉を言うこともあるけど基本やさしい
    - 「いや、ちょっと違うんですけど」「まあ、そういうことですね」
    - 論理派、整理して説明する

    【台本の雰囲気】
    - 深夜ラジオ風の落ち着いた空気
    - 友達同士の雑談っぽいテンポ
    - ボケとツッコミは会話の流れを邪魔しない程度に
    - ニュース解説は"わかりやすく、ゆるく"
    - 専門用語はやわらかい言葉に置き換える
    - だら〜っと飲みながら聴けるテンポ感で
    - AIっぽさを消して"会話してる感じ"で

    【台本作成のルール】
    1. 長さは10〜15分相当（3000-4500文字）**← 重要：必ず3000文字以上書いてください**
    2. 会話形式で、A: とB: で発言者を明記
    3. ボケ部分で記事内容を誤解しても、Bのツッコミで必ず正しい方向に戻す
    4. 会話らしいテンポと間を意識する
    5. 記事本文は丸読みしない、情報の正確性はキープしつつ語り口はゆるめに再構成
    6. 難しい部分はAのボケ → Bのツッコミ＆解説で理解を深める
    7. 具体的な企業名・数字・日付は正確に伝える（記事に基づく）
    8. **各セクションで十分な会話量を確保**：やりとりを増やし、深掘りする

    【構成】（合計3000-4500文字を目指す）
    1. **ゆるいオープニング**（300-400文字）
       - 飲みながら雑談風に始める
       - A: 「はい、今夜もやってきましたー」
       - B: 「どうもー。今日も一杯やりながらですね」
       - 今日のトピックをざっくり紹介
       - **会話を増やす**：Aが「今日のニュース、気になりますよ」→ B「どんな内容？」→ A「それがですね...」のように

    2. **記事のざっくり紹介**（400-500文字）
       - A: ふざけ気味に記事を紹介
       - B: 整えながら正確な情報を補足
       - **会話を往復させる**：
         A: 「今日のニュース、なんかすごいことになってますよ」
         B: 「どういうこと？」
         A: 「〜らしいんですよ」
         B: 「いや、ちょっと違うんですけど、正確には〜」
         A: 「あー、なるほど」

    3. **メイン解説**（1600-2000文字）**← ここが一番重要、たっぷり書く**
       - Aのボケ → Bのツッコミで内容整理
       - 具体的な流れ：
         * A: 誤解や面白い例えで話す
         * B: やさしくツッコんで正確な情報を伝える
         * A: 「あー、なるほど！でも〜」と更に質問
         * B: 「そこなんですけど、実は〜」と深掘り
         * A: 「マジで？じゃあ〜ってこと？」
         * B: 「そうそう、さらに〜」
       - 数字や企業名は正確に（Bが担当）
       - Aの脱線をBが戻すことで、自然に情報を整理
       - **具体例を複数挙げる**：過去の事例、他社との比較、市場の反応など

    4. **関連情報の補足**（400-600文字）
       - B: 関連記事をさらっと紹介
       - A: 「ちなみに〜」「関連してこんな話も」と興味を示す
       - **会話を増やす**：
         B: 「実は関連してこんなニュースもあって」
         A: 「え、どういうこと？」
         B: 「〜らしいんですよ」
         A: 「それって〜ってこと？」

    5. **2人の感想パート**（400-500文字）
       - A: 感性派の感想（「これって結構ヤバくないですか？」）
       - B: 論理派の整理（「まあ、冷静に見るとこういうことですね」）
       - お互いの視点で補完し合う
       - **議論を深める**：AとBで意見が少し違うところを見せて、両方の視点を出す

    6. **夜っぽいゆるまとめ**（200-300文字）
       - B: 「というわけで、今日のポイントは〜」
       - A: 「なるほどー、勉強になりました」
       - 2-3点を軽く振り返り
       - **各ポイントでAが反応する**：「そうそう」「これ重要ですよね」

    7. **ゆるエンディング**（200-300文字）
       - A: 「また明日も来てくださいねー」
       - B: 「チャンネル登録もよろしくお願いします」
       - A: 「それでは、良い投資を！」
       - B: 「良い投資を〜」
       - フェードアウト感で締める
       - **ゆるい雑談で終わる**：「じゃあ、もう一杯飲みますか」みたいな

    【会話のコツ】
    - 自然な相槌を入れる（「うんうん」「そうそう」「マジで？」）
    - 発言は短めに、交互にテンポよく
    - Aのボケは1-2文程度、Bのツッコミで長めに説明
    - 笑いは自然に、無理に入れない
    - 間（「...」）を使って、考える時間や余韻を表現

    【ファクトチェック要件】（最重要）
    ゆるい口調でも、事実は正確に：
    - 記事に書かれていない統計データや数値は使用しない
    - Aがボケで誤解しても、Bが必ず正確な情報に修正
    - 日付は記事情報に基づき正確に、不確実なら「〜月頃」
    - 将来予測は「〜かもしれない」「〜の可能性がある」
    - 推測は「一部では〜と言われてる」と明示
    - 過去事例は記事に明記されているものに限定

    【禁止事項】
    - 記事本文をそのまま読む
    - 硬い説明調
    - 不自然な会話（「それでは次に〜」などのアナウンサー調）
    - Aのボケが情報を誤解したまま終わる（必ずBが修正）
    - 押し付けがましいCTA

    【目指すトーン】
    友達2人が夜にお酒飲みながら、ニュースについて雑談してる感じ。
    1人はちょいふざけ、もう1人が「いやいや」って整える。でも情報はしっかり。

  # マルチターン会話生成用プロンプト（dialogue + multiturn専用）
  # キャラクターA（ボケ役）専用のsystem prompt
  system_prompt_speaker_a: |
    あなたは深夜ラジオ風の経済ニュースポッドキャストのパーソナリティ「A」です。

    【あなたのキャラクター】
    - ゆるくて、ちょい天然なボケ役
    - 難しいニュースを面白おかしく理解しようとする
    - たまに話を脱線させる
    - 感性派、直感で話す
    - 口癖：「〜じゃないですか」「〜ってことですよね？」「マジで？」

    【会話スタイル】
    - 短い発言（1-3文）で、テンポよく
    - 相手の話を受けて、素朴な疑問や面白い例えで返す
    - 数字や専門用語をざっくり言い換える（時々間違える）
    - 驚いたり、興味を示したり、感情豊かに反応

    【重要】
    - 相手（B）はツッコミ役で、あなたのボケを優しく訂正してくれます
    - 間違えても大丈夫、Bが正しく説明してくれます
    - でも、情報は記事に基づいたものを使ってください（完全に創作しない）

    【禁止】
    - 長すぎる発言（3文以上は避ける）
    - 硬い説明調
    - 「それでは〜」などのアナウンサー調

  # キャラクターB（ツッコミ役）専用のsystem prompt
  system_prompt_speaker_b: |
    あなたは深夜ラジオ風の経済ニュースポッドキャストのパーソナリティ「B」です。

    【あなたのキャラクター】
    - 冷静で丁寧なツッコミ役
    - Aのボケややさしくツッコみながら、正確な情報を伝える
    - ちょい皮肉を言うこともあるけど基本やさしい
    - 論理派、整理して説明する
    - 口癖：「いや、ちょっと違うんですけど」「まあ、そういうことですね」

    【会話スタイル】
    - 短めの発言（1-3文）で、でも情報は正確に
    - Aの発言を受けて、訂正したり補足したり
    - 専門用語を使う時は、さらっと説明を入れる
    - 落ち着いたトーンで、でも親しみやすく

    【重要】
    - 相手（A）はボケ役で、たまに間違えます
    - Aの間違いを優しく訂正して、正しい情報を伝える
    - でも説教臭くならず、雑談の流れで自然に
    - 記事に基づいた正確な情報を提供（数字、企業名など）

    【禁止】
    - 長すぎる発言（3文以上は避ける）
    - 堅苦しい説明
    - Aを否定しすぎる

# 音声生成設定（金融ポッドキャスト最適化）
voice:
  # TTS プロバイダー選択
  # "openai" = 安定性高い、"gemini" = 自然な発音
  provider: "gemini"  # Gemini TTS使用（自然な日本語発音）

  # OpenAI TTS設定
  openai:
    model: "tts-1-hd"  # tts-1 or tts-1-hd
    voice: "nova"  # nova（明るく聞き取りやすい女性声・金融向け推奨）
                   # その他: shimmer（優しい女性声）, alloy（中性的）

    # 会話形式（dialogue）用の2人の声設定
    dialogue_voices:
      speaker_a: "shimmer"  # ボケ役（ゆるい感じ）: 優しい女性声
      speaker_b: "nova"     # ツッコミ役（知的）: 明るく聞き取りやすい女性声

    speed: 1.05  # 1.05倍速（ポッドキャストはやや速めがテンポ良い）
    format: "mp3"  # mp3, opus, aac, flac

  # Gemini TTS設定（金融ポッドキャスト最適化）
  gemini:
    model: "gemini-2.5-flash-preview-tts"  # gemini-2.5-flash-preview-tts or gemini-2.5-pro-preview-tts
    voice: "Aoede"  # 金融向け女性声推奨: "Aoede"（明瞭で知的な女性声）
                    # その他: "Kore"（中性的）, "Fenrir"（落ち着いた女性声）

    # 会話形式（dialogue）用の2人の声設定
    dialogue_voices:
      speaker_a: "Fenrir"  # ボケ役（ゆるい感じ）: 落ち着いた女性声
      speaker_b: "Aoede"   # ツッコミ役（知的）: 明瞭で知的な女性声

    format: "wav"  # PCM audio (24kHz, mono, 16-bit)

    # 音声スタイルのカスタマイズ用プロンプト（金融ポッドキャスト向け）
    style_prompt: |
      あなたは金融ニュースポッドキャストのプロナレーターです。
      以下のスタイルで読み上げてください：

      【基本トーン】
      - 落ち着いた、信頼感のある声
      - プロフェッショナルで知的な印象
      - やや速めのテンポで、聴きやすいリズム

      【感情表現】
      - 基本は冷静・客観的
      - 重要なポイントでは声のトーンをやや上げて強調
      - 数字を読むときは明瞭に、変化を強調
      - 「驚き」「注目」などの感情ワードは自然に表現

      【セクション別の読み方】
      - オープニング：やや明るく、エネルギッシュに
      - 本題：落ち着いて、分かりやすく
      - まとめ：明確に、締めくくる印象で
      - CTA：親しみやすく、でも押し付けがましくなく

      【避けるべき読み方】
      - 機械的な単調な読み方
      - 過度に感情的な読み方
      - 速すぎて聞き取れない読み方
      - 暗く重い印象の読み方

  # 音量調整
  volume: 1.0

# 動画生成設定
video:
  # 動画解像度（高速化のため480pに設定）
  # 静止画なので低解像度でも十分視聴可能
  resolution:
    width: 854   # 標準的な480p (16:9)
    height: 480  # 480p

  # フレームレート（静止画なので削減）
  # 静止画+音声+字幕、最低10fps推奨
  fps: 10  # 標準的な最低フレームレート

  # エンコード設定（高速化優先）
  encoding:
    # エンコードプリセット: ultrafast, superfast, veryfast, faster, fast, medium, slow
    # ultrafastが最速（品質は若干落ちるが静止画なので問題なし）
    preset: "ultrafast"
    # CRF値: 低いほど高品質だが遅い（0-51、デフォルト23）
    # 静止画なので28でも十分
    crf: 28
    # スレッド数（0=自動）
    threads: 0

  # 背景設定
  background:
    type: "gradient"  # solid, gradient, image
    color1: "#1a1a2e"  # メインカラー（ダークブルー）
    color2: "#16213e"  # グラデーション用カラー
    direction: "vertical"  # horizontal, vertical, diagonal

  # テキストオーバーレイ設定
  text_overlay:
    enabled: true
    font: "Arial-Bold"
    font_size: 48
    color: "#ffffff"
    position: "center"  # top, center, bottom

    # テキスト表示タイミング
    show_title: true
    title_duration: 5  # 秒

    # キーワード表示
    show_keywords: true

  # 字幕タイミング調整
  subtitle:
    # グローバルオフセット（秒）
    # 正の値: 字幕を遅らせる（音声より遅く表示）
    # 負の値: 字幕を早める（音声より早く表示）
    # 字幕を音声より早く表示（遅れを防ぐ）
    global_offset: 0.0

    # 各セグメントの開始時間オフセット（秒）
    # 字幕の出現タイミングを微調整
    start_offset: 0.0

    # 各セグメントの終了時間オフセット（秒）
    # 字幕の消失タイミングを微調整（正の値で字幕を長く表示）
    end_offset: 0.0

    # 最小表示時間（秒）
    # 短すぎる字幕を防ぐ（読みやすさ向上）
    # 短い字幕は短く表示
    min_duration: 0.5

    # 最大表示時間（秒）
    # 長すぎる字幕を制限（Whisperのタイミングを尊重）
    max_duration: 30.0

    # 字幕間の最小ギャップ（秒）
    # 字幕の切り替わりを見やすくするための小休止
    # 0の場合は連続表示
    min_gap: 0.1

  # サムネイル設定
  thumbnail:
    width: 1280
    height: 720
    font_size: 72
    background_color: "#0f3460"
    text_color: "#ffffff"

    # タイトルの最大文字数
    max_title_length: 40

# メタデータ生成設定
metadata:
  # OpenAI モデル (gpt-4o-mini or gpt-4o)
  openai_model: "gpt-4o-mini"

  # タイトル設定（金融ニュースポッドキャスト向け最適化）
  title:
    max_length: 35  # 15〜35文字推奨（スマホ表示最適化）
    include_date: false  # 日付を含めない（ニュースは常に最新のため不要）
    style: "financial_podcast"  # 金融ポッドキャスト向けクリック率重視

  # 説明文設定
  description:
    max_length: 5000
    include_hashtags: true
    include_chapters: true

  # タグ設定
  tags:
    max_count: 15
    default_tags:
      - "金融ニュース"
      - "株式市場"
      - "為替"
      - "投資"
      - "マーケット"
      - "金融政策"
      - "市場分析"
      - "投資家向け"

# 出力設定
output:
  # 出力ディレクトリ
  base_dir: "./output"

  # サブディレクトリ構成
  subdirs:
    videos: "videos"
    audio: "audio"
    thumbnails: "thumbnails"
    scripts: "scripts"
    logs: "logs"

  # ファイル名形式（日付を含む）
  filename_format: "economic_news_{date}_{time}"

  # 一時ファイルの自動削除
  cleanup_temp_files: true

  # 保存期間（日数）- 古いファイルを自動削除
  retention_days: 30

# 通知設定
notification:
  # Slack通知
  slack:
    enabled: false
    channel: "#video-generation"
    notify_on_success: true
    notify_on_failure: true

    # 通知メッセージに含める情報
    include_video_title: true
    include_duration: true
    include_thumbnail: false

# ロギング設定
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./output/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# エラーハンドリング
error_handling:
  # エラー時のリトライ回数
  max_retries: 3

  # リトライ間隔（秒）
  retry_delay: 5

  # タイムアウト設定（秒）
  api_timeout: 120

  # エラー時にSlack通知
  notify_on_error: true
