# 経済ニュース動画生成システム設定ファイル

# アプリケーション基本設定
app:
  name: "経済ニュース解説チャンネル"
  language: "ja"
  timezone: "Asia/Tokyo"

# ニュース取得設定
news:
  # 取得するニュースのカテゴリ
  categories:
    - "経済"
    - "ビジネス"
    - "金融"
    - "株式市場"
    - "為替"

  # ニュースソース（優先順位順）
  sources:
    - "rss"  # RSSフィード
    - "newsapi"  # NewsAPI

  # RSS Feed URLs（高速化のため最小限に削減）
  rss_feeds:
    # 高速で安定したフィードのみ使用
    - "https://feeds.bloomberg.com/markets/news.rss"  # Bloomberg Markets
    - "https://www3.nhk.or.jp/rss/news/cat6.xml"  # NHK 経済ニュース
    # 以下はコメントアウト（必要に応じて有効化）
    # - "https://www.cnbc.com/id/100003114/device/rss/rss.html"  # CNBC Top News
    # - "https://www.ft.com/rss/home"  # Financial Times
    # - "https://www.economist.com/finance-and-economics/rss.xml"  # The Economist
    # - "https://www.reuters.com/markets"  # Reuters Markets
    # - "https://feeds.feedburner.com/wsj/xml/rss/3_7085.xml"  # WSJ Markets
    # - "https://news.yahoo.co.jp/rss/topics/business.xml"  # Yahoo!ニュース

  # RSS取得タイムアウト（秒）
  rss_timeout: 10

  # 取得記事数（複数ソースから集約）
  max_articles: 5  # 10 → 5に削減

  # ニュースの新しさ（時間単位）
  max_age_hours: 24

# 台本生成設定
script:
  # OpenAI モデル (gpt-4o-mini or gpt-4o)
  openai_model: "gpt-4o-mini"

  # 台本の長さ（文字数）- 高速化のため短縮
  min_length: 500   # 800 → 500
  max_length: 1200  # 2000 → 1200 (約60%削減)

  # スタイル設定
  tone: "professional"  # professional, casual, friendly
  style: "narration"  # narration, dialogue

  # プロンプトテンプレート
  system_prompt: |
    あなたは経済ニュースを分かりやすく解説するプロのナレーターです。
    視聴者は経済に興味はあるものの、専門知識は限定的な一般層を想定しています。
    以下の点に注意して台本を作成してください：
    - 専門用語は必要最小限にし、使う場合は簡単に説明する
    - 具体例や数字を交えて分かりやすく説明する
    - 視聴者の関心を引くような導入から始める
    - 結論や今後の展望で締めくくる
    - ナレーション形式で自然な話し言葉を使う

# 音声生成設定
voice:
  # TTS プロバイダー選択
  # "openai" = 安定性高い、"gemini" = 自然な発音
  provider: "gemini"  # Gemini TTS使用（自然な日本語発音）

  # OpenAI TTS設定
  openai:
    model: "tts-1-hd"  # tts-1 or tts-1-hd
    voice: "alloy"  # alloy, echo, fable, onyx, nova, shimmer
    speed: 1.0  # 0.25 to 4.0
    format: "mp3"  # mp3, opus, aac, flac

  # Gemini TTS設定
  gemini:
    model: "gemini-2.5-flash-preview-tts"  # gemini-2.5-flash-preview-tts or gemini-2.5-pro-preview-tts
    voice: "Kore"  # 30種類の声から選択（AI Studio で試聴可能）
    format: "wav"  # PCM audio (24kHz, mono, 16-bit)
    # 音声スタイルのカスタマイズ用プロンプト（オプション）
    # style_prompt: "落ち着いた、プロフェッショナルなナレーション口調で"

  # 音量調整
  volume: 1.0

# 動画生成設定
video:
  # 動画解像度（高速化のため540pに削減）
  # 静止画なので低解像度でも十分視聴可能
  resolution:
    width: 960   # 1920 → 960 (50%削減、さらに高速化)
    height: 540  # 1080 → 540

  # フレームレート（静止画なので大幅削減）
  # 静止画+音声+字幕なので低FPSでも問題なし
  fps: 10  # 24 → 10 (60%削減、字幕の滑らかさは維持)

  # エンコード設定（高速化優先）
  encoding:
    # エンコードプリセット: ultrafast, superfast, veryfast, faster, fast, medium, slow
    # ultrafastが最速（品質は若干落ちるが静止画なので問題なし）
    preset: "ultrafast"
    # CRF値: 低いほど高品質だが遅い（0-51、デフォルト23）
    # 静止画なので28でも十分
    crf: 28
    # スレッド数（0=自動）
    threads: 0

  # 背景設定
  background:
    type: "gradient"  # solid, gradient, image
    color1: "#1a1a2e"  # メインカラー（ダークブルー）
    color2: "#16213e"  # グラデーション用カラー
    direction: "vertical"  # horizontal, vertical, diagonal

  # テキストオーバーレイ設定
  text_overlay:
    enabled: true
    font: "Arial-Bold"
    font_size: 48
    color: "#ffffff"
    position: "center"  # top, center, bottom

    # テキスト表示タイミング
    show_title: true
    title_duration: 5  # 秒

    # キーワード表示
    show_keywords: true

  # 字幕タイミング調整
  subtitle:
    # グローバルオフセット（秒）
    # 正の値: 字幕を遅らせる（音声より遅く表示）
    # 負の値: 字幕を早める（音声より早く表示）
    # 最適値: 0.1秒（字幕を少し早める）
    global_offset: 0.1

    # 各セグメントの開始時間オフセット（秒）
    # 字幕の出現タイミングを微調整
    start_offset: 0.0

    # 各セグメントの終了時間オフセット（秒）
    # 字幕の消失タイミングを微調整（正の値で字幕を長く表示）
    end_offset: 0.0

    # 最小表示時間（秒）
    # 短すぎる字幕を防ぐ（読みやすさ向上）
    # 最低1秒間は表示する
    min_duration: 1.0

    # 最大表示時間（秒）
    # 長すぎる字幕を制限
    max_duration: 10.0

    # 字幕間の最小ギャップ（秒）
    # 字幕の切り替わりを見やすくするための小休止
    # 0の場合は連続表示
    min_gap: 0.1

  # サムネイル設定
  thumbnail:
    width: 1280
    height: 720
    font_size: 72
    background_color: "#0f3460"
    text_color: "#ffffff"

    # タイトルの最大文字数
    max_title_length: 40

# メタデータ生成設定
metadata:
  # OpenAI モデル (gpt-4o-mini or gpt-4o)
  openai_model: "gpt-4o-mini"

  # タイトル設定
  title:
    max_length: 100
    include_date: false  # 日付を含めない（ニュースは常に最新のため不要）
    style: "clickbait_moderate"  # formal, clickbait_moderate, clickbait_strong

  # 説明文設定
  description:
    max_length: 5000
    include_hashtags: true
    include_chapters: true

  # タグ設定
  tags:
    max_count: 15
    default_tags:
      - "経済ニュース"
      - "ビジネス"
      - "投資"
      - "マーケット"
      - "金融"

# 出力設定
output:
  # 出力ディレクトリ
  base_dir: "./output"

  # サブディレクトリ構成
  subdirs:
    videos: "videos"
    audio: "audio"
    thumbnails: "thumbnails"
    scripts: "scripts"
    logs: "logs"

  # ファイル名形式（日付を含む）
  filename_format: "economic_news_{date}_{time}"

  # 一時ファイルの自動削除
  cleanup_temp_files: true

  # 保存期間（日数）- 古いファイルを自動削除
  retention_days: 30

# 通知設定
notification:
  # Slack通知
  slack:
    enabled: false
    channel: "#video-generation"
    notify_on_success: true
    notify_on_failure: true

    # 通知メッセージに含める情報
    include_video_title: true
    include_duration: true
    include_thumbnail: false

# ロギング設定
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./output/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# エラーハンドリング
error_handling:
  # エラー時のリトライ回数
  max_retries: 3

  # リトライ間隔（秒）
  retry_delay: 5

  # タイムアウト設定（秒）
  api_timeout: 120

  # エラー時にSlack通知
  notify_on_error: true
