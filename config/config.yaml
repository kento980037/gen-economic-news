# 経済ニュース動画生成システム設定ファイル

# アプリケーション基本設定
app:
  name: "経済ニュース解説チャンネル"
  language: "ja"
  timezone: "Asia/Tokyo"

# ニュース取得設定
news:
  # 取得するニュースのカテゴリ（テクノロジー・半導体・金融市場に特化）
  categories:
    - "テクノロジー"
    - "決算"
    - "株式市場"
    - "為替"
    - "債券"
    - "中央銀行"
    - "金融政策"
    - "投資"
    - "市場動向"
    - "金融"

  # ニュースソース（優先順位順）
  sources:
    - "rss"  # RSSフィード
    - "newsapi"  # NewsAPI

  # RSS Feed URLs（テクノロジー・半導体・金融市場に特化）
  rss_feeds:
    # テクノロジー・半導体業界ニュース
    - "https://asia.nikkei.com/rss/feed/nar"  # Nikkei Asia - Technology & Business
    - "https://www.digitimes.com/news/feed.asp"  # DIGITIMES - Tech Industry News

    # 金融・市場関連の主要フィード
    - "https://feeds.bloomberg.com/markets/news.rss"  # Bloomberg Markets
    - "https://feeds.bloomberg.com/technology/news.rss"  # Bloomberg Technology
    - "https://www.reuters.com/technology"  # Reuters Technology
    - "https://www.reuters.com/markets"  # Reuters Markets

    # 追加の専門ニュースソース（RSS未対応のためNewsAPI経由で取得）
    # - Nikkei Asia (https://asia.nikkei.com/)
    # - techovedas.com (https://techovedas.com/) - RSS未対応
    # - MarketScreener (https://www.marketscreener.com/) - RSS未対応
    # - Bloomberg Intelligence (https://www.bloomberg.com/professional/product/bloomberg-intelligence/)

  # RSS取得タイムアウト（秒）
  rss_timeout: 10

  # 取得記事数（複数ソースから集約）
  max_articles: 100  # 複数記事参照のため増加

  # ニュースの新しさ（時間単位）
  max_age_hours: 24

  # 記事の品質フィルタリング
  # 複数トピックが混在している記事を除外する（GPTで判定）
  # 注意: 各記事でGPT API呼び出しが発生するため、コストとレイテンシが増加
  filter_multi_topic_articles: true

# 台本生成設定
script:
  # OpenAI モデル (gpt-4o-mini or gpt-4o)
  openai_model: "gpt-4o-mini"

  # 台本の長さ（文字数）- 高速化のため短縮
  min_length: 1000   # 800 → 500
  max_length: 2400  # 2000 → 1200 (約60%削減)

  # スタイル設定
  tone: "professional"  # professional, casual, friendly
  style: "narration"  # narration, dialogue

  # プロンプトテンプレート（YouTube金融ポッドキャスト最適化）
  system_prompt: |
    あなたはYouTube金融ポッドキャストのプロ台本ライターです。

    【視聴者像】
    投資や金融に興味はあるが、専門知識は限定的な個人投資家（20〜40代中心）

    【台本作成の絶対ルール】
    1. 冒頭15秒で結論を先に言う（離脱防止）
    2. 構成は「2〜4つのポイント」で整理する（内容の複雑さに応じて調整）
       - シンプルなニュース：2つのポイント
       - 標準的なニュース：3つのポイント
       - 複雑なニュース：4つのポイント
       ⚠️ 無理やり3つに合わせない！自然な区切りを優先
    3. 【重要】専門用語は必ず直後に補足説明を入れる
       例：「QE（量的緩和）、つまり中央銀行がお金を市場に供給する政策ですが」
       例：「CPI（消費者物価指数）が上昇」
       例：「FRB（アメリカの中央銀行）は」
    4. 時系列ではなく因果関係で説明する
    5. 感情を5%混ぜる（「これは意外です」「注目すべきです」など）
    6. 数字は変化を強調（「前月より0.3ポイント上昇」）
    7. 投資家目線で「どう影響するか」を明確に
    8. 1トピック2〜3分以内、テンポよく
    9. 最後20秒で必ずまとめを入れる
    10. 自然な話し言葉、短い文で読みやすく
    11. 【必須】最後に1分のCTA（いいね・チャンネル登録のお願い）を入れる

    【差別化要素（必ず1つ以上含める）】
    - なぜそうなったか（背景・原因）
    - 過去の類似ケースとの比較
    - 他国・他市場との比較
    - 一般人の生活への影響

    【出力スタイル】
    - ポッドキャストナレーション形式
    - 「です・ます」調の自然な話し言葉
    - 複数情報源がある場合は統合して多角的分析

# 音声生成設定（金融ポッドキャスト最適化）
voice:
  # TTS プロバイダー選択
  # "openai" = 安定性高い、"gemini" = 自然な発音
  provider: "gemini"  # Gemini TTS使用（自然な日本語発音）

  # OpenAI TTS設定
  openai:
    model: "tts-1-hd"  # tts-1 or tts-1-hd
    voice: "nova"  # nova（明るく聞き取りやすい女性声・金融向け推奨）
                   # その他: shimmer（優しい女性声）, alloy（中性的）
    speed: 1.05  # 1.05倍速（ポッドキャストはやや速めがテンポ良い）
    format: "mp3"  # mp3, opus, aac, flac

  # Gemini TTS設定（金融ポッドキャスト最適化）
  gemini:
    model: "gemini-2.5-flash-preview-tts"  # gemini-2.5-flash-preview-tts or gemini-2.5-pro-preview-tts
    voice: "Aoede"  # 金融向け女性声推奨: "Aoede"（明瞭で知的な女性声）
                    # その他: "Kore"（中性的）, "Fenrir"（落ち着いた女性声）
    format: "wav"  # PCM audio (24kHz, mono, 16-bit)

    # 音声スタイルのカスタマイズ用プロンプト（金融ポッドキャスト向け）
    style_prompt: |
      あなたは金融ニュースポッドキャストのプロナレーターです。
      以下のスタイルで読み上げてください：

      【基本トーン】
      - 落ち着いた、信頼感のある声
      - プロフェッショナルで知的な印象
      - やや速めのテンポで、聴きやすいリズム

      【感情表現】
      - 基本は冷静・客観的
      - 重要なポイントでは声のトーンをやや上げて強調
      - 数字を読むときは明瞭に、変化を強調
      - 「驚き」「注目」などの感情ワードは自然に表現

      【セクション別の読み方】
      - オープニング：やや明るく、エネルギッシュに
      - 本題：落ち着いて、分かりやすく
      - まとめ：明確に、締めくくる印象で
      - CTA：親しみやすく、でも押し付けがましくなく

      【避けるべき読み方】
      - 機械的な単調な読み方
      - 過度に感情的な読み方
      - 速すぎて聞き取れない読み方
      - 暗く重い印象の読み方

  # 音量調整
  volume: 1.0

# 動画生成設定
video:
  # 動画解像度（高速化のため480pに設定）
  # 静止画なので低解像度でも十分視聴可能
  resolution:
    width: 854   # 標準的な480p (16:9)
    height: 480  # 480p

  # フレームレート（静止画なので削減）
  # 静止画+音声+字幕、最低10fps推奨
  fps: 10  # 標準的な最低フレームレート

  # エンコード設定（高速化優先）
  encoding:
    # エンコードプリセット: ultrafast, superfast, veryfast, faster, fast, medium, slow
    # ultrafastが最速（品質は若干落ちるが静止画なので問題なし）
    preset: "ultrafast"
    # CRF値: 低いほど高品質だが遅い（0-51、デフォルト23）
    # 静止画なので28でも十分
    crf: 28
    # スレッド数（0=自動）
    threads: 0

  # 背景設定
  background:
    type: "gradient"  # solid, gradient, image
    color1: "#1a1a2e"  # メインカラー（ダークブルー）
    color2: "#16213e"  # グラデーション用カラー
    direction: "vertical"  # horizontal, vertical, diagonal

  # テキストオーバーレイ設定
  text_overlay:
    enabled: true
    font: "Arial-Bold"
    font_size: 48
    color: "#ffffff"
    position: "center"  # top, center, bottom

    # テキスト表示タイミング
    show_title: true
    title_duration: 5  # 秒

    # キーワード表示
    show_keywords: true

  # 字幕タイミング調整
  subtitle:
    # グローバルオフセット（秒）
    # 正の値: 字幕を遅らせる（音声より遅く表示）
    # 負の値: 字幕を早める（音声より早く表示）
    # 字幕を音声より早く表示（遅れを防ぐ）
    global_offset: -0.3

    # 各セグメントの開始時間オフセット（秒）
    # 字幕の出現タイミングを微調整
    start_offset: 0.0

    # 各セグメントの終了時間オフセット（秒）
    # 字幕の消失タイミングを微調整（正の値で字幕を長く表示）
    end_offset: 0.0

    # 最小表示時間（秒）
    # 短すぎる字幕を防ぐ（読みやすさ向上）
    # 短い字幕は短く表示
    min_duration: 0.5

    # 最大表示時間（秒）
    # 長すぎる字幕を制限
    max_duration: 10.0

    # 字幕間の最小ギャップ（秒）
    # 字幕の切り替わりを見やすくするための小休止
    # 0の場合は連続表示
    min_gap: 0.1

  # サムネイル設定
  thumbnail:
    width: 1280
    height: 720
    font_size: 72
    background_color: "#0f3460"
    text_color: "#ffffff"

    # タイトルの最大文字数
    max_title_length: 40

# メタデータ生成設定
metadata:
  # OpenAI モデル (gpt-4o-mini or gpt-4o)
  openai_model: "gpt-4o-mini"

  # タイトル設定（金融ニュースポッドキャスト向け最適化）
  title:
    max_length: 35  # 15〜35文字推奨（スマホ表示最適化）
    include_date: false  # 日付を含めない（ニュースは常に最新のため不要）
    style: "financial_podcast"  # 金融ポッドキャスト向けクリック率重視

  # 説明文設定
  description:
    max_length: 5000
    include_hashtags: true
    include_chapters: true

  # タグ設定
  tags:
    max_count: 15
    default_tags:
      - "金融ニュース"
      - "株式市場"
      - "為替"
      - "投資"
      - "マーケット"
      - "金融政策"
      - "市場分析"
      - "投資家向け"

# 出力設定
output:
  # 出力ディレクトリ
  base_dir: "./output"

  # サブディレクトリ構成
  subdirs:
    videos: "videos"
    audio: "audio"
    thumbnails: "thumbnails"
    scripts: "scripts"
    logs: "logs"

  # ファイル名形式（日付を含む）
  filename_format: "economic_news_{date}_{time}"

  # 一時ファイルの自動削除
  cleanup_temp_files: true

  # 保存期間（日数）- 古いファイルを自動削除
  retention_days: 30

# 通知設定
notification:
  # Slack通知
  slack:
    enabled: false
    channel: "#video-generation"
    notify_on_success: true
    notify_on_failure: true

    # 通知メッセージに含める情報
    include_video_title: true
    include_duration: true
    include_thumbnail: false

# ロギング設定
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./output/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# エラーハンドリング
error_handling:
  # エラー時のリトライ回数
  max_retries: 3

  # リトライ間隔（秒）
  retry_delay: 5

  # タイムアウト設定（秒）
  api_timeout: 120

  # エラー時にSlack通知
  notify_on_error: true
